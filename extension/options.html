<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Translator 設定</title>
  <style>
    :root { color-scheme: light; --bg:#f6f8fa; --card:#fff; --text:#1f2937; --muted:#64748b; --line:#dbe1e8; --accent:#059669; --danger:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif; background:var(--bg); color:var(--text); }
    .layout { width:min(980px,calc(100% - 32px)); margin:24px auto; display:grid; grid-template-columns:200px 1fr; gap:20px; }
    nav, main { background:var(--card); border:1px solid var(--line); border-radius:16px; }
    nav { padding:16px; height:max-content; position:sticky; top:16px; }
    nav h1 { font-size:16px; margin:0 0 12px; }
    .nav-btn { width:100%; margin:3px 0; padding:10px; border:0; border-radius:9px; text-align:left; background:transparent; color:var(--muted); cursor:pointer; }
    .nav-btn.active { background:#ecfdf5; color:#047857; font-weight:700; }
    main { padding:24px; }
    .step-section { display:none; }
    .step-section.active { display:block; }
    h2 { margin-top:0; }
    .desc,.hint { color:var(--muted); line-height:1.6; }
    .field { margin:18px 0; }
    label { display:block; font-weight:650; margin-bottom:6px; }
    input,select,textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font:inherit; background:#fff; color:var(--text); }
    textarea { resize:vertical; }
    button { font:inherit; }
    .btn { padding:9px 14px; border:1px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; }
    .btn:hover { border-color:var(--accent); }
    .btn-danger { color:var(--danger); }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .site-row { padding:14px; border:1px solid var(--line); border-radius:12px; margin:10px 0; background:#fafafa; }
    .site-row-header,.site-actions { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .site-host { font-weight:700; overflow-wrap:anywhere; }
    .site-edit { display:grid; gap:8px; margin-top:10px; }
    .check { display:flex; align-items:center; gap:6px; margin:0; }
    .check input { width:auto; }
    .btn-ghost { border:0; background:transparent; color:var(--muted); cursor:pointer; }
    .small { color:var(--muted); padding:18px; text-align:center; }
    .color-chips { display:flex; gap:12px; margin:12px 0 28px; }
    .color-chip { width:32px; height:32px; border-radius:50%; border:3px solid transparent; cursor:pointer; }
    .color-chip.selected { border-color:#111827; }
    .chip-inherit { background:#64748b; } .chip-blue { background:#3b82f6; } .chip-green { background:#10b981; } .chip-orange { background:#f59e0b; }
    .status { min-height:1.5em; color:var(--muted); }
    .msg-ok { color:#047857; } .msg-ng { color:var(--danger); }
    .toast { position:fixed; left:50%; bottom:20px; transform:translate(-50%,80px); opacity:0; padding:10px 18px; border-radius:10px; color:#fff; background:#111827; transition:.2s; pointer-events:none; }
    .toast.show { transform:translate(-50%,0); opacity:1; } .toast.success { background:#047857; } .toast.error { background:var(--danger); }
    @media (max-width:720px) { .layout { grid-template-columns:1fr; } nav { position:static; display:flex; flex-wrap:wrap; } nav h1 { width:100%; } .nav-btn { width:auto; } .two { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <nav>
      <h1>Gemini Translator</h1>
      <button class="nav-btn active" data-step-target="step-basic">基本</button>
      <button class="nav-btn" data-step-target="step-sites">サイト</button>
      <button class="nav-btn" data-step-target="step-display">表示</button>
      <button class="nav-btn" data-step-target="step-advanced">詳細</button>
    </nav>
    <main>
      <section id="step-basic" class="step-section active">
        <h2>基本設定</h2>
        <p class="desc">APIキーはChromeのローカル保存領域に保管され、翻訳時だけGoogle Gemini APIへ送られます。</p>
        <div class="field">
          <label for="gx-apikey">Google AI Studio API Key</label>
          <input id="gx-apikey" type="password" autocomplete="off" spellcheck="false" placeholder="AIzaSy...">
          <p class="hint">共有PCでは保存しないでください。漏えいが疑われる場合はGoogle AI Studioで失効させます。</p>
          <button class="btn" id="gx-test" type="button">キーをテスト</button>
        </div>
        <div class="two">
          <div class="field">
            <label for="gx-model">モデル</label>
            <select id="gx-model">
              <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite（推奨）</option>
              <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
              <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
            </select>
            <p class="hint">公式モデル一覧と料金を2026-08-30に確認。停止済みモデルは自動移行します。</p>
          </div>
          <div class="field">
            <label for="gx-direction">翻訳方向</label>
            <select id="gx-direction"><option value="en_to_ja">英語 → 日本語</option><option value="ja_to_en">日本語 → 英語</option></select>
          </div>
        </div>
      </section>

      <section id="step-sites" class="step-section">
        <h2>サイト管理</h2>
        <p class="desc">登録済みサイトと翻訳対象のCSSセレクタを管理します。保存値は表示前に検証し、HTMLとして解釈しません。</p>
        <div id="gx-site-registry"><div class="small">読み込み中…</div></div>
        <div id="gx-permission-status" class="status"></div>
      </section>

      <section id="step-display" class="step-section">
        <h2>表示設定</h2>
        <label>翻訳後の文字色</label>
        <div class="color-chips">
          <button class="color-chip chip-inherit" type="button" data-select-target="gx-translate-color-default" data-select-value="inherit" aria-label="変更なし"></button>
          <button class="color-chip chip-blue" type="button" data-select-target="gx-translate-color-default" data-select-value="blue" aria-label="青"></button>
          <button class="color-chip chip-green" type="button" data-select-target="gx-translate-color-default" data-select-value="green" aria-label="緑"></button>
          <button class="color-chip chip-orange" type="button" data-select-target="gx-translate-color-default" data-select-value="orange" aria-label="橙"></button>
        </div>
        <input type="hidden" id="gx-translate-color-default" value="inherit">
        <div class="field">
          <label for="gx-translate-color-rules">サイト別の色</label>
          <textarea id="gx-translate-color-rules" rows="5" placeholder="x.com | 青"></textarea>
          <button class="btn" id="gx-insert-color-example" type="button">例を追加</button>
        </div>
      </section>

      <section id="step-advanced" class="step-section">
        <h2>詳細設定</h2>
        <div class="two">
          <div class="field"><label for="gx-cost-limit">1日の金額上限（USD）</label><input id="gx-cost-limit" type="number" min="0" step="0.01"></div>
          <div class="field"><label for="gx-chars-limit">1日の文字数上限</label><input id="gx-chars-limit" type="number" min="0" step="1"></div>
        </div>
        <div class="field"><label for="gx-exclude-keywords">除外ワード</label><textarea id="gx-exclude-keywords" rows="4"></textarea></div>
        <div class="field"><label for="gx-glossary">用語集</label><textarea id="gx-glossary" rows="5" placeholder="tweet=ポスト"></textarea></div>
        <div class="field"><label class="check"><input id="gx-cache-enabled" type="checkbox" checked>翻訳キャッシュを使う</label></div>
        <div class="two">
          <button class="btn" id="gx-reset-stats" type="button">統計をリセット</button>
          <button class="btn btn-danger" id="gx-reset-settings" type="button">設定を初期化</button>
        </div>
        <div id="gx-reset-msg" class="status"></div>
      </section>

      <div hidden>
        <div id="gx-daykey"></div><div id="gx-brand-version"></div><a id="gx-brand-author"></a>
      </div>
    </main>
  </div>
  <div id="gx-toast" class="toast" role="status" aria-live="polite"></div>
  <script src="model-policy.js"></script>
  <script src="ui-storage-guard.js"></script>
  <script src="site-registry-ui.js"></script>
  <script src="options.js"></script>
  <script src="options-safe-ui.js"></script>
</body>
</html>
