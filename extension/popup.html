<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Translator</title>
  <style>
    :root { color-scheme:light; --bg:#fff; --sub:#f6f8fa; --text:#1f2937; --muted:#64748b; --line:#dbe1e8; --accent:#059669; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { width:340px; margin:0; font:13px system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif; color:var(--text); background:var(--bg); }
    header { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center; }
    #gx-host { max-width:145px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
    .stats { display:flex; gap:8px; font-size:10px; color:var(--muted); }
    section { padding:12px; border-bottom:1px solid var(--line); }
    .row { margin:10px 0; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    label { display:block; color:var(--muted); font-size:11px; margin-bottom:4px; }
    input,select,textarea { width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:7px; font:inherit; background:#fff; }
    button { font:inherit; cursor:pointer; }
    .btn { padding:8px 10px; border:1px solid var(--line); background:#fff; border-radius:8px; color:var(--text); }
    .btn:hover { border-color:var(--accent); }
    .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .toggle { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .switch { display:flex; align-items:center; gap:8px; font-weight:700; }
    .switch input { width:auto; }
    .muted,.permission-status { color:var(--muted); font-size:11px; line-height:1.5; }
    .actions { display:flex; gap:7px; }
    .actions > * { flex:1; }
    .color-chips { display:flex; justify-content:center; gap:12px; }
    .color-chip { width:25px; height:25px; border:3px solid transparent; border-radius:50%; }
    .color-chip.selected { border-color:#111827; }
    .chip-inherit{background:#64748b}.chip-blue{background:#3b82f6}.chip-green{background:#10b981}.chip-orange{background:#f59e0b}
    details summary { cursor:pointer; color:var(--muted); }
    .adv-link { display:block; padding:11px; text-align:center; color:var(--muted); text-decoration:none; }
    .toast { position:fixed; left:50%; bottom:12px; transform:translate(-50%,70px); opacity:0; background:#111827; color:#fff; padding:9px 16px; border-radius:9px; transition:.2s; pointer-events:none; }
    .toast.show { transform:translate(-50%,0); opacity:1; }.toast.success{background:#047857}.toast.error{background:var(--danger)}
  </style>
</head>
<body>
  <header>
    <div id="gx-host">-</div>
    <div class="stats"><strong id="gx-stats-cost">$0</strong><span><strong id="gx-stats-chars">0</strong>文字</span><span id="gx-stats-limit"></span></div>
  </header>

  <section>
    <div class="toggle">
      <label class="switch"><input id="gx-auto" type="checkbox"><span class="status-text">翻訳 OFF</span></label>
      <button class="btn" id="gx-clear-cache" type="button">キャッシュリセット</button>
    </div>
  </section>

  <div class="muted" id="gx-help-add-site" style="display:none;padding:10px 12px;">初めてのサイトでは、登録→権限許可→必要に応じて翻訳エリア選択の順に設定します。</div>

  <section>
    <div class="two">
      <div><label for="gx-direction">翻訳方向</label><select id="gx-direction"><option value="en_to_ja">英 → 日</option><option value="ja_to_en">日 → 英</option></select></div>
      <div><label for="gx-model">モデル</label><select id="gx-model"><option value="gemini-3.5-flash-lite">3.5 Lite</option><option value="gemini-3.1-flash-lite">3.1 Lite</option><option value="gemini-2.5-flash-lite">2.5 Lite</option></select></div>
    </div>
    <details class="row">
      <summary>API設定</summary>
      <div class="row"><label for="gx-apikey">Google AI Studio API Key</label><input id="gx-apikey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza..."></div>
      <button id="gx-save" class="btn primary" type="button">保存</button>
      <div id="gx-msg" class="muted"></div>
    </details>
  </section>

  <section>
    <label>翻訳後の文字色</label>
    <div class="color-chips">
      <button class="color-chip chip-inherit" data-color="inherit" type="button" aria-label="変更なし"></button>
      <button class="color-chip chip-blue" data-color="blue" type="button" aria-label="青"></button>
      <button class="color-chip chip-green" data-color="green" type="button" aria-label="緑"></button>
      <button class="color-chip chip-orange" data-color="orange" type="button" aria-label="橙"></button>
    </div>
  </section>

  <section>
    <div class="toggle row"><strong>このサイト</strong><label class="switch"><input id="gx-site-enabled" type="checkbox"><span>有効</span></label></div>
    <div class="actions row"><button class="btn" id="gx-register-site" type="button">登録</button><button class="btn" id="gx-request-permission" type="button">許可</button></div>
    <div id="gx-registry-status" class="permission-status">登録: -</div>
    <div id="gx-permission-status" class="permission-status">許可: -</div>
    <div class="toggle row"><span>SPA対策</span><label class="switch"><input id="gx-spa-scan-enabled" type="checkbox"><span>有効</span></label></div>
    <div class="actions row"><button class="btn" id="gx-pick-include" type="button">翻訳エリア選択</button><button class="btn" id="gx-open-site-settings-include" type="button">詳細編集</button></div>
    <div class="actions row"><button class="btn" id="gx-pick-exclude" type="button">除外エリア選択</button><button class="btn" id="gx-open-site-settings-exclude" type="button">詳細編集</button></div>
  </section>

  <div hidden>
    <button id="gx-test"></button><div id="gx-site-registry-status"></div><div id="gx-selector-status"></div><div id="gx-site-status"></div>
    <input id="gx-translate-color-default"><textarea id="gx-translate-color-rules"></textarea><textarea id="gx-exclude-keywords"></textarea>
    <input id="gx-cost-limit"><input id="gx-chars-limit"><textarea id="gx-glossary"></textarea><div id="gx-status"></div>
  </div>

  <a href="#" id="gx-open-options" class="adv-link">詳細設定</a>
  <div id="gx-toast" class="toast" role="status" aria-live="polite"></div>
  <script src="model-policy.js"></script>
  <script src="ui-storage-guard.js"></script>
  <script src="popup.js"></script>
  <script src="popup-pricing.js"></script>
</body>
</html>
